
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ESP32 WiFi Manager</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="topnav">
    <h1>ESP32 WIFI MANAGER</h1>
  </div>

  <div class="content">

    <div class="card-grid">

      <div class="card">

        <p class="card-title">
          CONFIGURACION WIFI
        </p>

        <form action="/" method="POST">

          <label for="ssid">Nombre de red WiFi (SSID)</label>

          <input
            type="text"
            id="ssid"
            name="ssid"
            placeholder="Nombre de la red"
            required
          >

          <label for="pass">Contraseña WiFi</label>

          <input
            type="password"
            id="pass"
            name="pass"
            placeholder="Contraseña WiFi"
          >

          <label for="ip">Direccion IP del ESP32</label>

          <input
            type="text"
            id="ip"
            name="ip"
            value="192.168.1.200"
            required
          >

          <label for="gateway">Gateway</label>

          <input
            type="text"
            id="gateway"
            name="gateway"
            value="192.168.1.1"
            required
          >

          <input
            type="submit"
            value="GUARDAR"
          >

        </form>

      </div>

    </div>

  </div>

</body>
</html>
