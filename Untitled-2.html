<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CONTROL GENERAL 4 RELES</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="topnav">
    <h1>CONTROL GENERAL 4 RELES</h1>
  </div>

  <div class="content">
    <div class="card-grid">
      <div class="card">

        <p class="card-title">
          CONTROL GENERAL
        </p>

        <p class="relay-info">
          Una sola orden controla los cuatro relés
        </p>

        <p>
          <a href="/on">
            <button class="button-on">
              ENCENDER
            </button>
          </a>
        </p>

        <p>
          <a href="/off">
            <button class="button-off">
              APAGAR
            </button>
          </a>
        </p>

        <hr>

        <p class="state">
          ESTADO GENERAL<br>
          %STATE%
        </p>

        <p class="relay-info">
          RELE 1 - GPIO 23<br>
          RELE 2 - GPIO 22<br>
          RELE 3 - GPIO 21<br>
          RELE 4 - GPIO 19
        </p>

      </div>
    </div>
  </div>

</body>
</html>
